services:
  - type: web
    name: skurge-business-os
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn web_app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SKURGE_SECRET_KEY
        generateValue: true
